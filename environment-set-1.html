<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Environment Set 1 – RRB JE CBT-2 | THE EXAM ENGINEER</title>
<meta name="description" content="RRB JE CBT-2 Environment Set 1 – Basics of Environment. 25 bilingual PYQ-based questions with 1/3 negative marking. THE EXAM ENGINEER.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#0f4a2d; --forest-2:#0b3320; --leaf:#16a34a; --leaf-soft:#e7f6ec;
  --amber:#f59e0b; --red:#dc2626; --red-soft:#fdecec; --violet:#7c3aed;
  --bg:#f3f6f2; --card:#ffffff; --ink:#17251d; --muted:#5b6b62; --line:#d8e2db; --chip:#e9eeea;
  --head-ink:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --forest:#0f3d26; --forest-2:#0a2a1a; --leaf:#34c26a; --leaf-soft:#123222;
    --amber:#fbbf24; --red:#f87171; --red-soft:#3a1717; --violet:#a78bfa;
    --bg:#0e1511; --card:#16211b; --ink:#e6efe9; --muted:#9db0a5; --line:#2a3a31; --chip:#223029;
    --head-ink:#ffffff;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Poppins","Noto Sans Devanagari",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-text-size-adjust:100%}
body.hi{font-family:"Noto Sans Devanagari","Poppins",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
a{color:inherit}

/* header */
header{background:linear-gradient(160deg,var(--forest),var(--forest-2));color:var(--head-ink);padding:12px 16px}
.hwrap{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:50%;background:#22c55e;color:#0b3320;display:grid;place-items:center;font-weight:700;flex:none}
.brand{flex:1;min-width:180px}
.brand b{display:block;font-size:16px;letter-spacing:.3px}
.brand a{font-size:12px;opacity:.85;text-decoration:none}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:#fff;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600}
.lang button[aria-pressed="true"]{background:#fff;color:var(--forest)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:8px;font-size:15px;display:none}
.timer.low{background:var(--red);color:#fff}

main{max-width:1040px;margin:0 auto;padding:18px 14px 40px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}

/* start screen */
.start h1{font-size:clamp(22px,4.6vw,32px);line-height:1.25;margin:4px 0 6px;color:var(--ink)}
.start .sub{color:var(--muted);margin:0 0 16px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 18px}
.fact{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.fact strong{display:block;font-size:22px;color:var(--leaf)}
.fact span{font-size:12.5px;color:var(--muted)}
.rules{margin:0 0 18px;padding-left:20px}
.rules li{margin:4px 0}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin-bottom:18px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:600;font-size:15px}
.btn-main{background:var(--leaf);color:#fff}
.btn-ghost{background:var(--chip);color:var(--ink)}
.btn-warn{background:var(--violet);color:#fff}
.btn-red{background:var(--red);color:#fff}
.copy{font-size:12px;color:var(--muted);margin-top:16px}

/* quiz */
.quiz{display:none;grid-template-columns:1fr 270px;gap:16px;align-items:start}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--muted);font-size:14px}
.qhead b{color:var(--ink)}
.marks{font-size:12.5px}
.qtext{font-size:17px;font-weight:500;margin:0 0 16px}
body.hi .qtext{font-size:18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:13px}
.opt[aria-checked="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.opt[aria-checked="true"] .k{background:var(--leaf);border-color:var(--leaf);color:#fff}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.actions .sp{flex:1}
.side h3{margin:0 0 10px;font-size:15px}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.pal button{border:0;border-radius:8px;height:38px;font-weight:600;background:var(--chip);color:var(--ink)}
.pal button.ans{background:var(--leaf);color:#fff}
.pal button.na{background:var(--red);color:#fff}
.pal button.mk{background:var(--violet);color:#fff}
.pal button.mka{background:var(--violet);color:#fff;box-shadow:inset 0 -5px 0 var(--leaf)}
.pal button.cur{outline:3px solid var(--amber);outline-offset:1px}
.counts{font-size:13px;color:var(--muted);margin:12px 0}
.counts div{display:flex;justify-content:space-between}

/* result */
.result{display:none}
.score{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-bottom:16px}
.ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring div{width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.ring strong{font-size:26px;line-height:1}
.ring span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:1;min-width:260px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat strong{display:block;font-size:20px}
.stat span{font-size:12.5px;color:var(--muted)}
.verdict{margin:0 0 16px;font-weight:500}
.review{margin-top:18px;display:grid;gap:12px}
.rv{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:12px 14px}
.rv.c{border-left-color:var(--leaf)} .rv.w{border-left-color:var(--red)} .rv.s{border-left-color:var(--amber)}
.rv .tag{font-size:12px;font-weight:600}
.rv.c .tag{color:var(--leaf)} .rv.w .tag{color:var(--red)} .rv.s .tag{color:var(--amber)}
.rv p{margin:6px 0}
.rv ul{list-style:none;padding:0;margin:6px 0;display:grid;gap:4px}
.rv li{padding:5px 9px;border-radius:7px;font-size:14.5px}
.rv li.right{background:var(--leaf-soft);color:var(--leaf);font-weight:600}
.rv li.wrong{background:var(--red-soft);color:var(--red);text-decoration:line-through}
.exp{font-size:14px;color:var(--muted);background:var(--chip);border-radius:8px;padding:8px 10px}
.join{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--leaf-soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:16px}
.join a.btn{text-decoration:none}
footer{text-align:center;font-size:12.5px;color:var(--muted);padding:0 14px 30px}
footer a{color:var(--leaf);font-weight:600;text-decoration:none}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;padding:16px;z-index:10}
.modal .box{background:var(--card);color:var(--ink);border-radius:14px;max-width:420px;width:100%;padding:20px}
.modal h3{margin:0 0 8px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

@media (max-width:820px){
  .quiz{grid-template-columns:1fr}
  .facts{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:no-preference){
  .opt,.pal button{transition:background .15s,border-color .15s}
}
</style>
</head>

 hi:{q:"निम्नलिखित में से कौन-सा युग्म सही सुमेलित है?",o:["पारिस्थितिकी (Ecology) – A.G. टैन्सले","पारितंत्र (Ecosystem) – अर्न्स्ट हैकल","जैव विविधता हॉटस्पॉट – नॉर्मन मायर्स","10% नियम – वाल्टर रोज़ेन"],e:"सही युग्म: Ecology–हैकल, Ecosystem–टैन्सले, 10% नियम–लिंडमैन, हॉटस्पॉट–मायर्स (1988)।"}},
{a:2,en:{q:"In the food chain Grass → Grasshopper → Frog → Snake → Hawk, the snake occupies:",o:["Second trophic level","Third trophic level","Fourth trophic level","Fifth trophic level"],e:"Count from the producer: grass is level 1, so the snake is level 4 (tertiary consumer)."},
 hi:{q:"खाद्य श्रृंखला घास → टिड्डा → मेंढक → साँप → बाज़ में साँप किस पोषी स्तर (trophic level) पर है?",o:["दूसरा पोषी स्तर","तीसरा पोषी स्तर","चौथा पोषी स्तर","पाँचवाँ पोषी स्तर"],e:"उत्पादक से गिनें: घास स्तर 1 है, इसलिए साँप स्तर 4 (तृतीयक उपभोक्ता) पर है।"}},
{a:1,en:{q:"Producers in a grassland trap 20,000 J of solar energy. According to Lindeman's 10% law, the energy available to secondary consumers will be about:",o:["2,000 J","200 J","20 J","2 J"],e:"Producers 20,000 → primary consumers 2,000 → secondary consumers 200 J."},
 hi:{q:"एक घास के मैदान में उत्पादक 20,000 J सौर ऊर्जा ग्रहण करते हैं। लिंडमैन के 10% नियम के अनुसार द्वितीयक उपभोक्ताओं को लगभग कितनी ऊर्जा मिलेगी?",o:["2,000 J","200 J","20 J","2 J"],e:"उत्पादक 20,000 → प्राथमिक उपभोक्ता 2,000 → द्वितीयक उपभोक्ता 200 J।"}},
{a:2,en:{q:"Which ecological pyramid is always upright in every ecosystem?",o:["Pyramid of numbers","Pyramid of biomass","Pyramid of energy","None of these"],e:"Energy is lost at every level and is never recycled, so this pyramid can never be inverted."},
 hi:{q:"कौन-सा पारिस्थितिक पिरामिड प्रत्येक पारितंत्र में सदैव सीधा (upright) रहता है?",o:["संख्या का पिरामिड","जैवभार (biomass) का पिरामिड","ऊर्जा का पिरामिड","इनमें से कोई नहीं"],e:"हर स्तर पर ऊर्जा का ह्रास होता है और इसका पुनर्चक्रण नहीं होता, इसलिए यह पिरामिड कभी उल्टा नहीं होता।"}},
{a:1,en:{q:"In a pond ecosystem, the pyramid of biomass is inverted because:",o:["Fish are smaller than phytoplankton","Phytoplankton have a small standing biomass but reproduce very fast","Energy flows from fish to plankton","Decomposers are absent in water"],e:"A small plankton biomass at any moment supports a larger fish biomass because the plankton turn over quickly."},
 hi:{q:"तालाब पारितंत्र में जैवभार का पिरामिड उल्टा होता है क्योंकि:",o:["मछलियाँ पादपप्लवकों से छोटी होती हैं","पादपप्लवकों (phytoplankton) का स्थायी जैवभार कम होता है पर वे बहुत तेज़ी से प्रजनन करते हैं","ऊर्जा मछली से प्लवक की ओर बहती है","जल में अपघटक नहीं होते"],e:"किसी भी समय प्लवक का कम जैवभार अधिक मछली जैवभार को सहारा देता है, क्योंकि प्लवक तेज़ी से पुनः बनते रहते हैं।"}},
{a:1,en:{q:"A food chain that begins with dead leaves, fallen fruits and animal remains, and passes through bacteria, fungi and earthworms, is called:",o:["Grazing food chain","Detritus food chain","Parasitic food chain","Predator chain"],e:"A detritus chain starts from dead organic matter; a grazing chain starts from green plants."},
 hi:{q:"जो खाद्य श्रृंखला गिरी हुई पत्तियों, फलों व जंतु अवशेषों से शुरू होकर जीवाणु, कवक और केंचुओं से होकर गुज़रती है, कहलाती है:",o:["चराई खाद्य श्रृंखला (Grazing)","अपरद खाद्य श्रृंखला (Detritus)","परजीवी खाद्य श्रृंखला","परभक्षी श्रृंखला"],e:"अपरद श्रृंखला मृत कार्बनिक पदार्थ से शुरू होती है; चराई श्रृंखला हरे पौधों से।"}},
{a:2,en:{q:"Which of the following biogeochemical cycles has no gaseous phase and is completed mainly through rocks and soil?",o:["Carbon cycle","Nitrogen cycle","Phosphorus cycle","Oxygen cycle"],e:"The phosphorus cycle is purely sedimentary; its main reservoir is phosphate rock."},
 hi:{q:"किस जैव-भू-रासायनिक चक्र (biogeochemical cycle) में कोई गैसीय चरण नहीं होता और यह मुख्यतः चट्टानों व मृदा से पूरा होता है?",o:["कार्बन चक्र","नाइट्रोजन चक्र","फॉस्फोरस चक्र","ऑक्सीजन चक्र"],e:"फॉस्फोरस चक्र पूर्णतः अवसादी (sedimentary) है; इसका मुख्य भंडार फॉस्फेट चट्टान है।"}},
{a:1,en:{q:"Root nodules of gram and pea plants contain bacteria that convert atmospheric N₂ into ammonia. These bacteria are:",o:["Nitrosomonas","Rhizobium","Pseudomonas","Lactobacillus"],e:"Rhizobium fixes nitrogen. Nitrosomonas carries out nitrification and Pseudomonas carries out denitrification."},
 hi:{q:"चना और मटर की जड़ ग्रंथिकाओं में ऐसे जीवाणु होते हैं जो वायुमंडलीय N₂ को अमोनिया में बदलते हैं। ये जीवाणु हैं:",o:["नाइट्रोसोमोनास (Nitrosomonas)","राइज़ोबियम (Rhizobium)","स्यूडोमोनास (Pseudomonas)","लैक्टोबैसिलस (Lactobacillus)"],e:"राइज़ोबियम नाइट्रोजन स्थिरीकरण करता है; नाइट्रोसोमोनास नाइट्रीकरण और स्यूडोमोनास विनाइट्रीकरण करते हैं।"}},
{a:1,en:{q:"In which layer of the atmosphere does temperature increase with height because ozone absorbs ultraviolet radiation?",o:["Troposphere","Stratosphere","Mesosphere","Exosphere"],e:"The ozone layer (15–35 km) in the stratosphere absorbs UV-B and heats this layer."},
 hi:{q:"वायुमंडल की किस परत में ओज़ोन द्वारा पराबैंगनी (UV) विकिरण अवशोषित होने के कारण ऊँचाई के साथ तापमान बढ़ता है?",o:["क्षोभमंडल (Troposphere)","समतापमंडल (Stratosphere)","मध्यमंडल (Mesosphere)","बहिर्मंडल (Exosphere)"],e:"समतापमंडल की ओज़ोन परत (15–35 km) UV-B अवशोषित करके इस परत को गर्म करती है।"}},
{a:1,en:{q:"The transition zone between a forest and a grassland often has more species and higher population density than either neighbouring community. This is known as:",o:["Ecocline","Edge effect","Ecological succession","Biomagnification"],e:"The edge effect occurs in an ecotone. An ecocline is a gradual, continuous change between ecosystems."},
 hi:{q:"वन और घास के मैदान के बीच के संक्रमण क्षेत्र में अक्सर दोनों पड़ोसी समुदायों से अधिक प्रजातियाँ और अधिक जनसंख्या घनत्व पाया जाता है। इसे कहते हैं:",o:["इकोक्लाइन (Ecocline)","कोर/किनारा प्रभाव (Edge effect)","पारिस्थितिक अनुक्रमण (Ecological succession)","जैव-आवर्धन (Biomagnification)"],e:"किनारा प्रभाव (Edge effect) इकोटोन में होता है। इकोक्लाइन दो पारितंत्रों के बीच क्रमिक, सतत परिवर्तन है।"}},
{a:1,en:{q:"A scientist records not only where a species lives but also what it eats, when it is active and how it interacts with other organisms. This total functional role is the species':",o:["Habitat","Ecological niche","Biome","Population"],e:"Niche = habitat + functional role (Joseph Grinnell). Habitat is only the \"physical address\"."},
 hi:{q:"एक वैज्ञानिक किसी प्रजाति के बारे में यह भी दर्ज करता है कि वह कहाँ रहती है, क्या खाती है, कब सक्रिय रहती है और अन्य जीवों से कैसे अंतःक्रिया करती है। यह संपूर्ण कार्यात्मक भूमिका उस प्रजाति का ____ है:",o:["आवास (Habitat)","पारिस्थितिक निकेत (Ecological niche)","बायोम (Biome)","जनसंख्या (Population)"],e:"निकेत = आवास + कार्यात्मक भूमिका (जोसेफ ग्रिनेल)। आवास केवल \"भौतिक पता\" है।"}},
{a:2,en:{q:"India has thousands of varieties of rice and over 1,000 varieties of mango. This variation within a single species represents:",o:["Species diversity","Ecosystem diversity","Genetic diversity","Community diversity"],e:"Variation within one species is genetic diversity, one of the three levels of biodiversity."},
 hi:{q:"भारत में धान की हज़ारों और आम की 1,000 से अधिक किस्में हैं। एक ही प्रजाति के भीतर यह विविधता दर्शाती है:",o:["प्रजाति विविधता","पारितंत्र विविधता","आनुवंशिक विविधता (Genetic diversity)","सामुदायिक विविधता"],e:"एक प्रजाति के भीतर भिन्नता आनुवंशिक विविधता है – जैव विविधता के तीन स्तरों में से एक।"}},
{a:3,en:{q:"Which of the following is NOT one of the four global biodiversity hotspots that cover parts of India?",o:["Western Ghats–Sri Lanka","Indo-Burma","Sundaland","Eastern Ghats"],e:"India's hotspots are the Himalaya, Indo-Burma, Western Ghats–Sri Lanka and Sundaland (Nicobar)."},
 hi:{q:"निम्न में से कौन भारत के भागों को समाहित करने वाले चार वैश्विक जैव विविधता हॉटस्पॉट में से एक नहीं है?",o:["पश्चिमी घाट–श्रीलंका","इंडो-बर्मा","सुंडालैंड","पूर्वी घाट"],e:"भारत के हॉटस्पॉट: हिमालय, इंडो-बर्मा, पश्चिमी घाट–श्रीलंका और सुंडालैंड (निकोबार)।"}},
{a:2,en:{q:"Which of the following is an example of ex-situ conservation?",o:["National park","Biosphere reserve","Seed bank","Wildlife sanctuary"],e:"Ex-situ means outside the natural habitat (seed or gene banks, zoos, botanical gardens). The other three are in-situ."},
 hi:{q:"निम्न में से कौन बाह्य-स्थाने (ex-situ) संरक्षण का उदाहरण है?",o:["राष्ट्रीय उद्यान","जीवमंडल आरक्षित क्षेत्र","बीज बैंक","वन्यजीव अभयारण्य"],e:"बाह्य-स्थाने = प्राकृतिक आवास से बाहर (बीज/जीन बैंक, चिड़ियाघर, वनस्पति उद्यान)। बाकी तीनों स्व-स्थाने (in-situ) हैं।"}},
{a:1,en:{q:"\"Development that meets the needs of the present without compromising the ability of future generations to meet their own needs.\" This definition was given in:",o:["Stockholm Declaration, 1972","Brundtland Report \"Our Common Future\", 1987","Agenda 21, 1992","Kyoto Protocol, 1997"],e:"It was given by the World Commission on Environment and Development (Brundtland Commission), 1987."},
 hi:{q:"\"ऐसा विकास जो भावी पीढ़ियों की अपनी आवश्यकताएँ पूरी करने की क्षमता से समझौता किए बिना वर्तमान की आवश्यकताएँ पूरी करे।\" यह परिभाषा किसमें दी गई?",o:["स्टॉकहोम घोषणा, 1972","ब्रंटलैंड रिपोर्ट \"Our Common Future\", 1987","एजेंडा 21, 1992","क्योटो प्रोटोकॉल, 1997"],e:"यह पर्यावरण एवं विकास पर विश्व आयोग (ब्रंटलैंड आयोग), 1987 ने दी।"}},
{a:1,en:{q:"A country wants an indicator that adjusts its national income for the depletion of natural resources and environmental damage. The most suitable indicator is:",o:["Nominal GDP","Green GDP","Per capita income","GDP growth rate"],e:"Green GDP accounts for environmental costs. Plain GDP or its growth rate is not a sustainability indicator."},
 hi:{q:"एक देश ऐसा सूचक चाहता है जो प्राकृतिक संसाधनों के क्षय और पर्यावरणीय क्षति को ध्यान में रखकर राष्ट्रीय आय को समायोजित करे। सबसे उपयुक्त सूचक है:",o:["नाममात्र GDP (Nominal GDP)","हरित GDP (Green GDP)","प्रति व्यक्ति आय","GDP वृद्धि दर"],e:"हरित GDP पर्यावरणीय लागत गिनता है। केवल GDP या उसकी वृद्धि दर सततता का सूचक नहीं है।"}},
{a:1,en:{q:"The ecological footprint of a nation is compared with its ________ to judge whether it is living sustainably.",o:["Population density","Biocapacity","Literacy rate","Industrial output"],e:"Footprint (demand) and biocapacity (supply) are both measured in global hectares (gha). If footprint exceeds biocapacity, the nation is in ecological deficit."},
 hi:{q:"यह जानने के लिए कि कोई राष्ट्र सतत रूप से जी रहा है या नहीं, उसके पारिस्थितिक पदचिह्न (ecological footprint) की तुलना उसकी ________ से की जाती है।",o:["जनसंख्या घनत्व","जैव-क्षमता (Biocapacity)","साक्षरता दर","औद्योगिक उत्पादन"],e:"पदचिह्न (माँग) और जैव-क्षमता (आपूर्ति) दोनों ग्लोबल हेक्टेयर (gha) में मापे जाते हैं। पदचिह्न अधिक हो तो राष्ट्र पारिस्थितिक घाटे में है।"}},
{a:2,en:{q:"A forest department must harvest timber while causing the least damage to soil, young trees and wildlife. It should adopt:",o:["Clear felling","Mechanised logging","Reduced-impact logging","Shifting cultivation"],e:"Reduced-impact logging uses planned, directional felling with minimal damage. Clear felling is the most damaging."},
 hi:{q:"एक वन विभाग को मृदा, नए पेड़ों और वन्यजीवों को न्यूनतम क्षति पहुँचाते हुए इमारती लकड़ी काटनी है। उसे अपनाना चाहिए:",o:["पूर्ण कटाई (Clear felling)","यंत्रीकृत कटाई (Mechanised logging)","न्यूनीकृत-प्रभाव कटाई (Reduced-impact logging)","झूम खेती (Shifting cultivation)"],e:"न्यूनीकृत-प्रभाव कटाई में योजनाबद्ध, दिशात्मक कटाई से न्यूनतम क्षति होती है। पूर्ण कटाई सबसे हानिकारक है।"}},
{a:2,en:{q:"If all bacteria and fungi were suddenly removed from a forest ecosystem, the most direct long-term effect would be:",o:["Faster flow of energy to top carnivores","More oxygen in the atmosphere","Dead organic matter would pile up and nutrients would not return to the soil","Producers would start making food at night"],e:"Decomposers break down dead matter and recycle nutrients to the soil; without them nutrient cycling stops."},
 hi:{q:"यदि किसी वन पारितंत्र से सभी जीवाणु और कवक अचानक हटा दिए जाएँ, तो सबसे प्रत्यक्ष दीर्घकालिक प्रभाव होगा:",o:["शीर्ष मांसाहारियों तक ऊर्जा का तेज़ प्रवाह","वायुमंडल में अधिक ऑक्सीजन","मृत कार्बनिक पदार्थ जमा होता जाएगा और पोषक तत्व मृदा में वापस नहीं लौटेंगे","उत्पादक रात में भोजन बनाने लगेंगे"],e:"अपघटक (decomposers) मृत पदार्थ को तोड़कर पोषक तत्व मृदा में लौटाते हैं; उनके बिना पोषक चक्रण रुक जाता है।"}},
{a:0,en:{q:"Which of the following statements about an ecosystem is correct?",o:["Energy flow is one-way, while nutrients move in cycles","Both energy and nutrients move in cycles","Energy moves in cycles, while nutrients flow one-way","Neither energy nor nutrients are lost from an ecosystem"],e:"Energy from the sun is lost as heat at each level and never returns; nutrients like C, N and P are recycled through biogeochemical cycles."},
 hi:{q:"पारितंत्र के बारे में निम्नलिखित में से कौन-सा कथन सही है?",o:["ऊर्जा प्रवाह एक-दिशीय है, जबकि पोषक तत्व चक्रीय रूप से घूमते हैं","ऊर्जा और पोषक तत्व दोनों चक्रीय रूप से घूमते हैं","ऊर्जा चक्रीय रूप से घूमती है, जबकि पोषक तत्वों का प्रवाह एक-दिशीय है","पारितंत्र से न ऊर्जा का ह्रास होता है, न पोषक तत्वों का"],e:"सूर्य की ऊर्जा हर स्तर पर ऊष्मा के रूप में नष्ट होती है और वापस नहीं आती; C, N, P जैसे पोषक तत्व जैव-भू-रासायनिक चक्रों से पुनर्चक्रित होते हैं।"}},
{a:1,en:{q:"Only about 2.5% of Earth's water is fresh water. The largest share of this fresh water is stored as:",o:["Groundwater","Glaciers and ice caps","Rivers and lakes","Atmospheric water vapour"],e:"Of total fresh water, about 68.7% is in glaciers and ice caps, about 30.1% is groundwater and only about 1.2% is surface water."},
 hi:{q:"पृथ्वी के कुल जल का केवल लगभग 2.5% मीठा जल है। इस मीठे जल का सबसे बड़ा हिस्सा किस रूप में संचित है?",o:["भूजल (Groundwater)","हिमनद और हिम-टोपियाँ (Glaciers and ice caps)","नदियाँ और झीलें","वायुमंडलीय जल वाष्प"],e:"कुल मीठे जल का लगभग 68.7% हिमनदों व हिम-टोपियों में, लगभग 30.1% भूजल में और केवल लगभग 1.2% सतही जल में है।"}},
{a:2,en:{q:"After nitrogen (about 78%) and oxygen (about 21%), the next most abundant gas in dry air by volume is:",o:["Carbon dioxide","Water vapour","Argon","Helium"],e:"Argon is about 0.93%; carbon dioxide is only about 0.04% (around 420 ppm). Water vapour is not counted in dry air."},
 hi:{q:"शुष्क वायु में आयतन के अनुसार नाइट्रोजन (लगभग 78%) और ऑक्सीजन (लगभग 21%) के बाद सबसे अधिक मात्रा वाली गैस है:",o:["कार्बन डाइऑक्साइड","जल वाष्प","आर्गन (Argon)","हीलियम"],e:"आर्गन लगभग 0.93% है; कार्बन डाइऑक्साइड केवल लगभग 0.04% (करीब 420 ppm) है। शुष्क वायु में जल वाष्प नहीं गिना जाता।"}},
{a:3,en:{q:"The Red Data Book, which lists threatened species of plants and animals along with their level of risk, is maintained by:",o:["UNEP","WWF","Botanical Survey of India","IUCN"],e:"The IUCN (International Union for Conservation of Nature) maintains the Red Data Book / Red List; India's BSI and ZSI publish national Red Data Books."},
 hi:{q:"रेड डेटा बुक, जिसमें पौधों और जंतुओं की संकटग्रस्त प्रजातियों की सूची उनके जोखिम स्तर सहित होती है, किसके द्वारा रखी जाती है?",o:["UNEP","WWF","भारतीय वनस्पति सर्वेक्षण (BSI)","IUCN"],e:"IUCN (अंतर्राष्ट्रीय प्रकृति संरक्षण संघ) रेड डेटा बुक / रेड लिस्ट रखता है; भारत में BSI और ZSI राष्ट्रीय रेड डेटा बुक प्रकाशित करते हैं।"}}
];

const N = Q.length, TOTAL = Math.round(N*48), K = "abcd";
let lang = "en", cur = 0, ans, visited, marked, left, tick, done = false;
const $ = id => document.getElementById(id);
const t = k => UI[lang][k];

function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.body.classList.toggle("hi", l === "hi");
  $("bEn").setAttribute("aria-pressed", l === "en");
  $("bHi").setAttribute("aria-pressed", l === "hi");
  document.querySelectorAll("[data-t]").forEach(el => { const v = t(el.dataset.t); if (typeof v === "string") el.textContent = v; });
  $("rules").innerHTML = t("rules").map(r => `<li>${r}</li>`).join("");
  $("legend").innerHTML = t("legend").map(([c,l]) => `<span><i style="background:${c}"></i>${l}</span>`).join("");
  if ($("quiz").style.display === "grid") renderQ();
  if (done) renderResult();
}

function reset(){
  ans = Array(N).fill(null); visited = Array(N).fill(false); marked = Array(N).fill(false);
  cur = 0; left = TOTAL; done = false;
}

function startTest(){
  reset();
  $("start").style.display = "none"; $("result").style.display = "none";
  $("quiz").style.display = "grid"; $("timer").style.display = "block";
  renderQ(); updTimer();
  clearInterval(tick);
  tick = setInterval(() => { left--; updTimer(); if (left <= 0) { finish(true); } }, 1000);
  window.scrollTo(0,0);
}

function updTimer(){
  const m = Math.floor(Math.max(left,0)/60), s = Math.max(left,0)%60;
  $("timer").textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  $("timer").classList.toggle("low", left <= 120);
}

function renderQ(){
  visited[cur] = true;
  const q = Q[cur][lang];
  $("qno").textContent = `${t("q")} ${cur+1} ${t("of")} ${N}`;
  $("qtext").textContent = q.q;
  $("opts").innerHTML = q.o.map((o,i) =>
    `<button class="opt" role="radio" aria-checked="${ans[cur]===i}" data-i="${i}"><span class="k">${K[i]}</span><span>${o}</span></button>`).join("");
  $("opts").querySelectorAll(".opt").forEach(b => b.onclick = () => { ans[cur] = +b.dataset.i; renderQ(); });
  $("prevBtn").disabled = cur === 0;
  renderPal();
}

function renderPal(){
  $("pal").innerHTML = Q.map((_,i) => {
    let c = "";
    if (marked[i]) c = ans[i] !== null ? "mka" : "mk";
    else if (ans[i] !== null) c = "ans";
    else if (visited[i]) c = "na";
    return `<button class="${c}${i===cur?" cur":""}" data-i="${i}" aria-label="${t("q")} ${i+1}">${i+1}</button>`;
  }).join("");
  $("pal").querySelectorAll("button").forEach(b => b.onclick = () => { cur = +b.dataset.i; renderQ(); });
  const a = ans.filter(x => x !== null).length, mk = marked.filter(Boolean).length;
  const nv = visited.filter(v => !v).length, na = visited.filter((v,i) => v && ans[i] === null).length;
  $("counts").innerHTML = [[t("cAns"),a],[t("cNa"),na],[t("cMk"),mk],[t("cNv"),nv]].map(([l,v]) => `<div><span>${l}</span><b>${v}</b></div>`).join("");
}

function go(d){ if (cur + d >= 0 && cur + d < N) { cur += d; renderQ(); window.scrollTo({top:0}); } }

function askSubmit(){
  const a = ans.filter(x => x !== null).length;
  $("mBody").textContent = UI[lang].mBody(a, N - a);
  $("modal").style.display = "grid"; $("mYes").focus();
}

function finish(auto){
  clearInterval(tick); done = true;
  $("modal").style.display = "none";
  $("quiz").style.display = "none"; $("timer").style.display = "none";
  $("result").style.display = "block";
  renderResult();
  if (auto) alert(t("timeUp"));
  window.scrollTo(0,0);
}

function renderResult(){
  let c = 0, w = 0;
  Q.forEach((q,i) => { if (ans[i] === null) return; ans[i] === q.a ? c++ : w++; });
  const s = N - c - w, score = Math.round((c - w/3) * 100) / 100;
  const acc = c + w ? Math.round(c / (c + w) * 100) : 0;
  $("scoreVal").textContent = score;
  const pct = Math.max(0, score) / N * 100;
  $("ring").style.background = `conic-gradient(var(--leaf) ${pct}%, var(--chip) 0)`;
  $("stats").innerHTML = [[t("sC"),c,"var(--leaf)"],[t("sW"),w,"var(--red)"],[t("sS"),s,"var(--amber)"],[t("sA"),acc+"%","var(--ink)"]]
    .map(([l,v,col]) => `<div class="stat"><strong style="color:${col}">${v}</strong><span>${l}</span></div>`).join("");
  const v = t("verdicts"); $("verdict").textContent = score < 10 ? v[0] : score < 16 ? v[1] : score < 21 ? v[2] : v[3];
  $("review").innerHTML = Q.map((q,i) => {
    const d = q[lang], u = ans[i], st = u === null ? "s" : u === q.a ? "c" : "w";
    const tag = st === "c" ? t("tC") : st === "w" ? t("tW") : t("tS");
    const opts = d.o.map((o,j) => `<li class="${j===q.a?"right":(j===u?"wrong":"")}">(${K[j]}) ${o}</li>`).join("");
    return `<div class="rv ${st}"><span class="tag">${t("q")} ${i+1} · ${tag}</span><p>${d.q}</p><ul>${opts}</ul><div class="exp"><b>${t("ans")}: (${K[q.a]})</b> – ${d.e}</div></div>`;
  }).join("");
}

$("bEn").onclick = () => setLang("en");
$("bHi").onclick = () => setLang("hi");
$("startBtn").onclick = startTest;
$("retryBtn").onclick = startTest;
$("prevBtn").onclick = () => go(-1);
$("nextBtn").onclick = () => { if (cur === N-1) renderQ(); else go(1); };
$("clearBtn").onclick = () => { ans[cur] = null; renderQ(); };
$("markBtn").onclick = () => { marked[cur] = !marked[cur]; if (cur < N-1) go(1); else renderQ(); };
$("submitBtn").onclick = askSubmit;
$("mNo").onclick = () => { $("modal").style.display = "none"; };
$("mYes").onclick = () => finish(false);
document.addEventListener("keydown", e => {
  if ($("modal").style.display === "grid" && e.key === "Escape") $("modal").style.display = "none";
  if ($("quiz").style.display !== "grid" || $("modal").style.display === "grid") return;
  if (["1","2","3","4"].includes(e.key)) { ans[cur] = +e.key - 1; renderQ(); }
  if (e.key === "ArrowRight") go(1);
  if (e.key === "ArrowLeft") go(-1);
});
reset(); setLang("en");
</script>
