<style>
:root{
  --forest:#0f4a2d; --forest-2:#0b3320; --leaf:#16a34a; --leaf-soft:#e7f6ec;
  --amber:#f59e0b; --red:#dc2626; --red-soft:#fdecec; --violet:#7c3aed;
  --bg:#f3f6f2; --card:#ffffff; --ink:#17251d; --muted:#5b6b62; --line:#d8e2db; --chip:#e9eeea;
  --head-ink:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{

    --forest:#0f3d26; --forest-2:#0a2a1a; --leaf:#34c26a; --leaf-soft:#123222;

  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Poppins","Noto Sans Devanagari",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-text-size-adjust:100%}
body.hi{font-family:"Noto Sans Devanagari","Poppins",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
a{color:inherit}

/* header */
header{background:linear-gradient(160deg,var(--forest),var(--forest-2));color:var(--head-ink);padding:12px 16px}
.hwrap{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:50%;background:#22c55e;color:#0b3320;display:grid;place-items:center;font-weight:700;flex:none}
.brand{flex:1;min-width:180px}
.brand b{display:block;font-size:16px;letter-spacing:.3px}
.brand a{font-size:12px;opacity:.85;text-decoration:none}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:#fff;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600}
.lang button[aria-pressed="true"]{background:#fff;color:var(--forest)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:8px;font-size:15px;display:none}
.timer.low{background:var(--red);color:#fff}

main{max-width:1040px;margin:0 auto;padding:18px 14px 40px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}

/* start screen */
.start h1{font-size:clamp(22px,4.6vw,32px);line-height:1.25;margin:4px 0 6px;color:var(--ink)}
.start .sub{color:var(--muted);margin:0 0 16px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 18px}
.fact{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.fact strong{display:block;font-size:22px;color:var(--leaf)}
.fact span{font-size:12.5px;color:var(--muted)}
.rules{margin:0 0 18px;padding-left:20px}
.rules li{margin:4px 0}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin-bottom:18px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:600;font-size:15px}
.btn-main{background:var(--leaf);color:#fff}
.btn-ghost{background:var(--chip);color:var(--ink)}
.btn-warn{background:var(--violet);color:#fff}
.btn-red{background:var(--red);color:#fff}
.copy{font-size:12px;color:var(--muted);margin-top:16px}

/* quiz */
.quiz{display:none;grid-template-columns:1fr 270px;gap:16px;align-items:start}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--muted);font-size:14px}
.qhead b{color:var(--ink)}
.marks{font-size:12.5px}
.qtext{font-size:17px;font-weight:500;margin:0 0 16px}
body.hi .qtext{font-size:18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:13px}
.opt[aria-checked="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.opt[aria-checked="true"] .k{background:var(--leaf);border-color:var(--leaf);color:#fff}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.actions .sp{flex:1}
.side h3{margin:0 0 10px;font-size:15px}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.pal button{border:0;border-radius:8px;height:38px;font-weight:600;background:var(--chip);color:var(--ink)}
.pal button.ans{background:var(--leaf);color:#fff}
.pal button.na{background:var(--red);color:#fff}
.pal button.mk{background:var(--violet);color:#fff}
.pal button.mka{background:var(--violet);color:#fff;box-shadow:inset 0 -5px 0 var(--leaf)}
.pal button.cur{outline:3px solid var(--amber);outline-offset:1px}
.counts{font-size:13px;color:var(--muted);margin:12px 0}
.counts div{display:flex;justify-content:space-between}

/* result */
.result{display:none}
.score{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-bottom:16px}
.ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring div{width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.ring strong{font-size:26px;line-height:1}
.ring span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:1;min-width:260px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat strong{display:block;font-size:20px}
.stat span{font-size:12.5px;color:var(--muted)}
.verdict{margin:0 0 16px;font-weight:500}
.review{margin-top:18px;display:grid;gap:12px}
.rv{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:12px 14px}
.rv.c{border-left-color:var(--leaf)} .rv.w{border-left-color:var(--red)} .rv.s{border-left-color:var(--amber)}
.rv .tag{font-size:12px;font-weight:600}
.rv.c .tag{color:var(--leaf)} .rv.w .tag{color:var(--red)} .rv.s .tag{color:var(--amber)}
.rv p{margin:6px 0}
.rv ul{list-style:none;padding:0;margin:6px 0;display:grid;gap:4px}
.rv li{padding:5px 9px;border-radius:7px;font-size:14.5px}
.rv li.right{background:var(--leaf-soft);color:var(--leaf);font-weight:600}
.rv li.wrong{background:var(--red-soft);color:var(--red);text-decoration:line-through}
.exp{font-size:14px;color:var(--muted);background:var(--chip);border-radius:8px;padding:8px 10px}
.join{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--leaf-soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:16px}
.join a.btn{text-decoration:none}
footer{text-align:center;font-size:12.5px;color:var(--muted);padding:0 14px 30px}
footer a{color:var(--leaf);font-weight:600;text-decoration:none}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;padding:16px;z-index:10}
.modal .box{background:var(--card);color:var(--ink);border-radius:14px;max-width:420px;width:100%;padding:20px}
.modal h3{margin:0 0 8px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

@media (max-width:820px){
  .quiz{grid-template-columns:1fr}
  .facts{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:no-preference){
  .opt,.pal button{transition:background .15s,border-color .15s}
}
</style>

के छिलके", "सूती कपड़ा, लकड़ी, चमड़ा", "काँच, DDT, एल्युमिनियम के डिब्बे", "सीवेज, जूट, सूखी पत्तियाँ"], "e": "सूक्ष्मजीव काँच, DDT या धातुओं को नहीं तोड़ पाते, इसलिए ये बहुत लंबे समय तक बने रहते हैं।"}}, {"a": 3, "en": {"q": "Lichens are almost absent near a coal-based thermal power plant but grow abundantly in a forest 40 km away. The pollutant most likely high near the plant is:", "o": ["Methane", "Nitrogen", "Carbon monoxide", "Sulphur dioxide"], "e": "Lichens are very sensitive to SO₂ and are used as bio-indicators of SO₂ pollution."}, "hi": {"q": "कोयला आधारित थर्मल पावर प्लांट के पास लाइकेन लगभग नहीं मिलते, पर 40 km दूर एक वन में खूब उगते हैं। प्लांट के पास किस प्रदूषक की अधिकता सबसे संभावित है?", "o": ["मीथेन", "नाइट्रोजन", "कार्बन मोनोऑक्साइड", "सल्फ़र डाइऑक्साइड"], "e": "लाइकेन SO₂ के प्रति अत्यंत संवेदनशील होते हैं और SO₂ प्रदूषण के जैव-सूचक (bio-indicator) के रूप में उपयोग होते हैं।"}}, {"a": 1, "en": {"q": "A bacterial consortium such as \"Oilzapper\" is sprayed on an oil-contaminated site to degrade the oil. This technique is called:", "o": ["Phytoremediation", "Bioremediation", "Biomagnification", "Incineration"], "e": "Bioremediation uses microbes to clean pollutants. Phytoremediation uses plants."}, "hi": {"q": "तेल से दूषित स्थल पर तेल को अपघटित करने के लिए \"ऑयलज़ैपर (Oilzapper)\" जैसा जीवाणु संघ छिड़का जाता है। यह तकनीक कहलाती है:", "o": ["पादप-उपचार (Phytoremediation)", "जैव-उपचार (Bioremediation)", "जैव-आवर्धन (Biomagnification)", "भस्मीकरण (Incineration)"], "e": "जैव-उपचार में सूक्ष्मजीवों से प्रदूषक साफ़ किए जाते हैं। पादप-उपचार में पौधों का उपयोग होता है।"}}, {"a": 3, "en": {"q": "Which pollution control approach is considered the most effective and is placed first in the control hierarchy?", "o": ["Dilution using tall chimneys", "End-of-pipe treatment", "Landfilling of residues", "Prevention at the source"], "e": "Using cleaner fuels and processes so that less pollution is produced is the best option. Tall chimneys only spread pollutants over a wider area."}, "hi": {"q": "कौन-सा प्रदूषण नियंत्रण दृष्टिकोण सबसे प्रभावी माना जाता है और नियंत्रण पदानुक्रम में सबसे पहले आता है?", "o": ["ऊँची चिमनियों से तनुकरण", "एंड-ऑफ़-पाइप उपचार", "अवशेषों का भू-भराव", "स्रोत पर ही रोकथाम"], "e": "स्वच्छ ईंधन और प्रक्रिया अपनाकर कम प्रदूषण पैदा करना सबसे अच्छा विकल्प है। ऊँची चिमनियाँ प्रदूषकों को केवल बड़े क्षेत्र में फैला देती हैं।"}}, {"a": 0, "en": {"q": "A tannery that polluted a river is ordered to pay for cleaning the river and to compensate the affected farmers. The principle applied here is:", "o": ["Polluter Pays Principle", "Precautionary Principle", "Public Trust Doctrine", "Sustainable Yield Principle"], "e": "Under this principle, whoever causes pollution bears the cost of remedying it."}, "hi": {"q": "नदी को प्रदूषित करने वाली एक चर्मशोधन इकाई (tannery) को नदी की सफ़ाई का खर्च उठाने और प्रभावित किसानों को मुआवज़ा देने का आदेश दिया जाता है। यहाँ लागू सिद्धांत है:", "o": ["प्रदूषक भुगतान सिद्धांत (Polluter Pays)", "एहतियाती सिद्धांत (Precautionary)", "लोक न्यास सिद्धांत (Public Trust)", "सतत उपज सिद्धांत (Sustainable Yield)"], "e": "इस सिद्धांत के अनुसार प्रदूषण करने वाला ही उसके निवारण की लागत वहन करता है।"}}, {"a": 2, "en": {"q": "Before a new thermal power plant is approved, a study predicts its likely effects on air, water, land and local people. This study is called:", "o": ["Environmental audit", "Life cycle assessment", "Environment impact assessment", "Carbon footprint accounting"], "e": "EIA is done before a project (EIA Notification 2006). An environmental audit checks a unit that is already running."}, "hi": {"q": "किसी नए थर्मल पावर प्लांट को मंज़ूरी देने से पहले वायु, जल, भूमि और स्थानीय लोगों पर उसके संभावित प्रभावों का अध्ययन किया जाता है। यह अध्ययन कहलाता है:", "o": ["पर्यावरण लेखा-परीक्षा (Environmental audit)", "जीवन चक्र आकलन (Life cycle assessment)", "पर्यावरण प्रभाव आकलन (EIA)", "कार्बन फ़ुटप्रिंट लेखांकन"], "e": "EIA परियोजना से पहले होता है (EIA अधिसूचना 2006)। पर्यावरण लेखा-परीक्षा पहले से चल रही इकाई की जाँच है।"}}, {"a": 3, "en": {"q": "A family keeps a charcoal heater burning in a closed room overnight and wakes up with headache and dizziness. The pollutant and its action are:", "o": ["CO₂ – raises blood acidity", "SO₂ – forms acid in lungs", "O₃ – damages lung tissue", "CO – blocks haemoglobin"], "e": "Incomplete combustion produces CO, which binds haemoglobin far more strongly than O₂ (carboxyhaemoglobin) and cuts oxygen supply."}, "hi": {"q": "एक परिवार बंद कमरे में रात भर कोयले की अंगीठी जलाकर रखता है और सुबह सिरदर्द व चक्कर के साथ उठता है। प्रदूषक और उसकी क्रिया है:", "o": ["CO₂ – रक्त की अम्लता बढ़ाती है", "SO₂ – फेफड़ों में अम्ल बनाती है", "O₃ – फेफड़ों के ऊतक नष्ट करती है", "CO – हीमोग्लोबिन को अवरुद्ध करती है"], "e": "अपूर्ण दहन से CO बनती है, जो O₂ से कहीं अधिक मज़बूती से हीमोग्लोबिन से जुड़ती है (कार्बोक्सीहीमोग्लोबिन) और ऑक्सीजन आपूर्ति घटाती है।"}}, {"a": 0, "en": {"q": "The main man-made source of sulphur dioxide in the atmosphere is:", "o": ["Coal-based thermal power plants", "CNG-run city buses", "Flooded paddy fields", "Old refrigerators and ACs"], "e": "Coal and metal ores contain sulphur, which burns to form SO₂. Paddy fields emit methane; refrigerators leak CFCs."}, "hi": {"q": "वायुमंडल में सल्फ़र डाइऑक्साइड का मुख्य मानवजनित स्रोत है:", "o": ["कोयला आधारित थर्मल पावर प्लांट", "CNG से चलने वाली सिटी बसें", "जलमग्न धान के खेत", "पुराने रेफ़्रिजरेटर और AC"], "e": "कोयले और धातु अयस्कों में सल्फ़र होता है, जो जलकर SO₂ बनाता है। धान के खेत मीथेन और रेफ़्रिजरेटर CFC छोड़ते हैं।"}}, {"a": 1, "en": {"q": "PM2.5 is considered more harmful to health than PM10 because:", "o": ["It settles quickly in the nose and throat", "It reaches deep alveoli and enters the blood", "It is a gas that reacts with oxygen", "It carries more water vapour than PM10"], "e": "Particles of 2.5 µm or less bypass the nose and throat defences and cause asthma and heart disease."}, "hi": {"q": "PM2.5 को PM10 से अधिक हानिकारक माना जाता है क्योंकि:", "o": ["यह नाक और गले में जल्दी बैठ जाता है", "यह गहरे वायुकोषों तक पहुँचकर रक्त में जाता है", "यह एक गैस है जो ऑक्सीजन से अभिक्रिया करती है", "इसमें PM10 से अधिक जल वाष्प होता है"], "e": "2.5 µm या उससे छोटे कण नाक-गले की सुरक्षा को पार कर जाते हैं और दमा व हृदय रोग पैदा करते हैं।"}}, {"a": 1, "en": {"q": "On a warm, sunny afternoon in a city with heavy traffic, a brownish haze forms and causes eye irritation. This is:", "o": ["London smog rich in SO₂", "Photochemical smog rich in O₃", "Radiation fog rich in moisture", "Ash haze from forest fires"], "e": "NOₓ + hydrocarbons + sunlight produce O₃ and PAN. This smog is oxidising in nature."}, "hi": {"q": "भारी यातायात वाले शहर में एक गर्म, धूप वाली दोपहर को भूरी धुंध बनती है और आँखों में जलन होती है। यह है:", "o": ["SO₂ से भरपूर लंदन स्मॉग", "O₃ से भरपूर प्रकाश-रासायनिक स्मॉग", "नमी से भरपूर विकिरण कोहरा", "वनाग्नि से बनी राख की धुंध"], "e": "NOₓ + हाइड्रोकार्बन + सूर्यप्रकाश से O₃ और PAN बनते हैं। यह स्मॉग ऑक्सीकारक (oxidising) होता है।"}}, {"a": 1, "en": {"q": "Which set correctly describes classical (London) smog?", "o": ["Warm, sunny, oxidising", "Cold, humid, reducing", "Warm, dry, oxidising", "Cold, sunny, oxidising"], "e": "London smog = SO₂ + smoke + fog in cold, humid weather; it is reducing in nature (London, 1952)."}, "hi": {"q": "कौन-सा समूह पारंपरिक (लंदन) स्मॉग का सही वर्णन करता है?", "o": ["गर्म, धूप वाला, ऑक्सीकारक", "ठंडा, नम, अपचायक", "गर्म, शुष्क, ऑक्सीकारक", "ठंडा, धूप वाला, ऑक्सीकारक"], "e": "लंदन स्मॉग = ठंडे, नम मौसम में SO₂ + धुआँ + कोहरा; यह अपचायक (reducing) होता है (लंदन, 1952)।"}}, {"a": 0, "en": {"q": "In Delhi, pollution stays trapped near the ground on winter mornings mainly because of:", "o": ["Temperature inversion near the ground", "Strong winds from nearby states", "High humidity after heavy rainfall", "Thinning of the ozone layer in winter"], "e": "In an inversion, a warm air layer sits over cooler surface air, so pollutants cannot rise and disperse."}, "hi": {"q": "दिल्ली में सर्दियों की सुबह प्रदूषण मुख्यतः किस कारण सतह के पास फँसा रहता है?", "o": ["सतह के पास तापमान व्युत्क्रमण", "पड़ोसी राज्यों से तेज़ हवाएँ", "भारी वर्षा के बाद अधिक आर्द्रता", "सर्दियों में ओज़ोन परत का पतला होना"], "e": "व्युत्क्रमण (inversion) में ठंडी सतही वायु के ऊपर गर्म वायु की परत होती है, जिससे प्रदूषक ऊपर उठकर फैल नहीं पाते।"}}, {"a": 1, "en": {"q": "A radioactive gas that seeps into houses from soil and building materials and is a major cause of lung cancer indoors is:", "o": ["Formaldehyde", "Radon", "Ozone", "Carbon dioxide"], "e": "Radon comes from the decay of radium in rocks and soil. Formaldehyde is also an indoor pollutant but it is not radioactive."}, "hi": {"q": "मृदा और भवन-निर्माण सामग्री से घरों में रिसने वाली रेडियोधर्मी गैस, जो घर के अंदर फेफड़ों के कैंसर का प्रमुख कारण है:", "o": ["फ़ॉर्मेल्डिहाइड", "रेडॉन (Radon)", "ओज़ोन", "कार्बन डाइऑक्साइड"], "e": "रेडॉन चट्टानों व मृदा में रेडियम के क्षय से बनती है। फ़ॉर्मेल्डिहाइड भी आंतरिक प्रदूषक है, पर रेडियोधर्मी नहीं।"}}, {"a": 2, "en": {"q": "Children living near an informal battery-recycling unit show anaemia and learning difficulties. The pollutant most likely responsible is:", "o": ["Carbon dioxide", "Ozone", "Lead", "Radon"], "e": "Lead (from batteries and old leaded petrol) damages the nervous system and brain in children and causes anaemia."}, "hi": {"q": "एक अनौपचारिक बैटरी-रीसाइक्लिंग इकाई के पास रहने वाले बच्चों में रक्ताल्पता और सीखने में कठिनाई दिखती है। सबसे संभावित ज़िम्मेदार प्रदूषक है:", "o": ["कार्बन डाइऑक्साइड", "ओज़ोन", "सीसा (Lead)", "रेडॉन"], "e": "सीसा (बैटरियों और पुराने सीसायुक्त पेट्रोल से) बच्चों के तंत्रिका तंत्र व मस्तिष्क को क्षति पहुँचाता है और रक्ताल्पता करता है।"}}, {"a": 0, "en": {"q": "Vehicles fitted with a catalytic converter must use unleaded petrol because:", "o": ["Lead deactivates the Pt–Pd–Rh catalyst", "Lead reduces the fuel mileage sharply", "Unleaded petrol has more octane", "The converter itself releases lead fumes"], "e": "Lead coats the catalyst surface and the converter stops converting CO, HC and NOₓ."}, "hi": {"q": "उत्प्रेरक परिवर्तक (catalytic converter) वाले वाहनों में सीसा-रहित पेट्रोल ही उपयोग करना चाहिए क्योंकि:", "o": ["सीसा Pt–Pd–Rh उत्प्रेरक को निष्क्रिय करता है", "सीसा ईंधन माइलेज तेज़ी से घटाता है", "सीसा-रहित पेट्रोल में ऑक्टेन अधिक होता है", "परिवर्तक स्वयं सीसे का धुआँ छोड़ता है"], "e": "सीसा उत्प्रेरक की सतह पर परत बना देता है और परिवर्तक CO, HC व NOₓ को बदलना बंद कर देता है।"}}, {"a": 3, "en": {"q": "A thermal power plant needs to remove very fine fly ash from flue gas with about 99% efficiency. The most suitable device is:", "o": ["Gravity settling chamber", "Centrifugal cyclone separator", "Venturi wet scrubber", "Electrostatic precipitator"], "e": "An ESP charges the particles and collects them on plates; it is the standard device in Indian thermal plants."}, "hi": {"q": "एक थर्मल पावर प्लांट को फ़्लू गैस से बहुत महीन फ़्लाई ऐश लगभग 99% दक्षता से हटानी है। सबसे उपयुक्त उपकरण है:", "o": ["गुरुत्व निःसादन कक्ष", "अपकेन्द्री चक्रवात पृथक्कारी", "वेंचुरी आर्द्र स्क्रबर", "स्थिरवैद्युत अवक्षेपक (ESP)"], "e": "ESP कणों को आवेशित करके प्लेटों पर एकत्र करता है; यह भारतीय थर्मल प्लांटों का मानक उपकरण है।"}}, {"a": 2, "en": {"q": "Which air-pollution control device uses centrifugal force to separate coarse dust particles from a gas stream?", "o": ["Fabric bag filter", "Electrostatic precipitator", "Cyclone separator", "Catalytic converter"], "e": "The gas swirls inside the cyclone; heavy particles are thrown to the wall and fall down."}, "hi": {"q": "कौन-सा वायु-प्रदूषण नियंत्रण उपकरण गैस धारा से मोटे धूल कणों को अलग करने के लिए अपकेन्द्री बल का उपयोग करता है?", "o": ["फ़ैब्रिक बैग फ़िल्टर", "स्थिरवैद्युत अवक्षेपक", "चक्रवात पृथक्कारी (Cyclone)", "उत्प्रेरक परिवर्तक"], "e": "साइक्लोन में गैस घूमती है; भारी कण दीवार की ओर फेंके जाकर नीचे गिर जाते हैं।"}}, {"a": 1, "en": {"q": "To remove SO₂ from the flue gas of a coal-fired power plant, limestone slurry is sprayed into the gas. This technology is:", "o": ["Electrostatic precipitation", "Flue-gas desulphurisation", "Fabric bag filtration", "Catalytic conversion"], "e": "Limestone (CaCO₃) reacts with SO₂ to form calcium sulphite/gypsum."}, "hi": {"q": "कोयला आधारित बिजली संयंत्र की फ़्लू गैस से SO₂ हटाने के लिए उसमें चूना-पत्थर का घोल छिड़का जाता है। यह तकनीक है:", "o": ["स्थिरवैद्युत अवक्षेपण", "फ़्लू-गैस विगंधकीकरण (FGD)", "फ़ैब्रिक बैग निस्यंदन", "उत्प्रेरकीय परिवर्तन"], "e": "चूना-पत्थर (CaCO₃) SO₂ से अभिक्रिया करके कैल्शियम सल्फ़ाइट/जिप्सम बनाता है।"}}, {"a": 2, "en": {"q": "The National Air Quality Index (AQI) launched in India in 2014 is based on:", "o": ["6 pollutants, 8 categories", "12 pollutants, 6 categories", "8 pollutants, 6 categories", "10 pollutants, 5 categories"], "e": "8 pollutants: PM10, PM2.5, NO₂, SO₂, CO, O₃, NH₃, Pb; 6 bands from Good to Severe. (12 pollutants is NAAQS, not AQI.)"}, "hi": {"q": "भारत में 2014 में शुरू किया गया राष्ट्रीय वायु गुणवत्ता सूचकांक (AQI) आधारित है:", "o": ["6 प्रदूषक, 8 श्रेणियाँ", "12 प्रदूषक, 6 श्रेणियाँ", "8 प्रदूषक, 6 श्रेणियाँ", "10 प्रदूषक, 5 श्रेणियाँ"], "e": "8 प्रदूषक: PM10, PM2.5, NO₂, SO₂, CO, O₃, NH₃, Pb; अच्छा से गंभीर तक 6 श्रेणियाँ। (12 प्रदूषक NAAQS में हैं, AQI में नहीं।)"}}, {"a": 3, "en": {"q": "A city reports an AQI value of 350. This falls in the category:", "o": ["Poor", "Severe", "Moderate", "Very poor"], "e": "0–50 Good, 51–100 Satisfactory, 101–200 Moderate, 201–300 Poor, 301–400 Very poor, 401–500 Severe."}, "hi": {"q": "एक शहर का AQI मान 350 दर्ज होता है। यह किस श्रेणी में आता है?", "o": ["ख़राब (Poor)", "गंभीर (Severe)", "मध्यम (Moderate)", "बहुत ख़राब (Very poor)"], "e": "0–50 अच्छा, 51–100 संतोषजनक, 101–200 मध्यम, 201–300 ख़राब, 301–400 बहुत ख़राब, 401–500 गंभीर।"}}, {"a": 0, "en": {"q": "As per India's NAAQS (2009), the annual average standard for PM2.5 is:", "o": ["40 µg/m³", "5 µg/m³", "60 µg/m³", "15 µg/m³"], "e": "NAAQS: 40 µg/m³ annual and 60 µg/m³ for 24 hours. 5 µg/m³ is the WHO 2021 guideline (trap option)."}, "hi": {"q": "भारत के NAAQS (2009) के अनुसार PM2.5 का वार्षिक औसत मानक है:", "o": ["40 µg/m³", "5 µg/m³", "60 µg/m³", "15 µg/m³"], "e": "NAAQS: वार्षिक 40 µg/m³ और 24 घंटे के लिए 60 µg/m³। 5 µg/m³ WHO 2021 दिशानिर्देश है (ट्रैप विकल्प)।"}}, {"a": 1, "en": {"q": "India adopted Bharat Stage VI (BS-VI) emission norms nationwide, skipping BS-V, from:", "o": ["1 April 2017", "1 April 2020", "1 January 2022", "1 April 2023"], "e": "India moved directly from BS-IV to BS-VI on 1 April 2020."}, "hi": {"q": "भारत ने BS-V को छोड़कर भारत स्टेज VI (BS-VI) उत्सर्जन मानक पूरे देश में कब से लागू किए?", "o": ["1 अप्रैल 2017", "1 अप्रैल 2020", "1 जनवरी 2022", "1 अप्रैल 2023"], "e": "भारत 1 अप्रैल 2020 को सीधे BS-IV से BS-VI पर पहुँचा।"}}, {"a": 1, "en": {"q": "Noise was included as an \"air pollutant\" under the Air (Prevention & Control of Pollution) Act, 1981 by an amendment in:", "o": ["1981", "1987", "1986", "2000"], "e": "The amendment came in 1987. 1986 is the EP Act and 2000 is the Noise Rules."}, "hi": {"q": "वायु (प्रदूषण निवारण एवं नियंत्रण) अधिनियम, 1981 में शोर को \"वायु प्रदूषक\" के रूप में किस वर्ष के संशोधन द्वारा शामिल किया गया?", "o": ["1981", "1987", "1986", "2000"], "e": "संशोधन 1987 में हुआ। 1986 = EP अधिनियम और 2000 = ध्वनि प्रदूषण नियम।"}}];

const N = Q.length, TOTAL = Math.round(N*48), K = "abcd";
let lang = "en", cur = 0, ans, visited, marked, left, tick, done = false;
const $ = id => document.getElementById(id);
const t = k => UI[lang][k];

function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.body.classList.toggle("hi", l === "hi");
  $("bEn").setAttribute("aria-pressed", l === "en");
  $("bHi").setAttribute("aria-pressed", l === "hi");
  document.querySelectorAll("[data-t]").forEach(el => { const v = t(el.dataset.t); if (typeof v === "string") el.textContent = v; });
  $("rules").innerHTML = t("rules").map(r => `<li>${r}</li>`).join("");
  $("legend").innerHTML = t("legend").map(([c,l]) => `<span><i style="background:${c}"></i>${l}</span>`).join("");
  if ($("quiz").style.display === "grid") renderQ();
  if (done) renderResult();
}

function reset(){
  ans = Array(N).fill(null); visited = Array(N).fill(false); marked = Array(N).fill(false);
  cur = 0; left = TOTAL; done = false;
}

function startTest(){
  reset();
  $("start").style.display = "none"; $("result").style.display = "none";
  $("quiz").style.display = "grid"; $("timer").style.display = "block";
  renderQ(); updTimer();
  clearInterval(tick);
  tick = setInterval(() => { left--; updTimer(); if (left <= 0) { finish(true); } }, 1000);
  window.scrollTo(0,0);
}

function updTimer(){
  const m = Math.floor(Math.max(left,0)/60), s = Math.max(left,0)%60;
  $("timer").textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  $("timer").classList.toggle("low", left <= 120);
}

function renderQ(){
  visited[cur] = true;
  const q = Q[cur][lang];
  $("qno").textContent = `${t("q")} ${cur+1} ${t("of")} ${N}`;
  $("qtext").textContent = q.q;
  $("opts").innerHTML = q.o.map((o,i) =>
    `<button class="opt" role="radio" aria-checked="${ans[cur]===i}" data-i="${i}"><span class="k">${K[i]}</span><span>${o}</span></button>`).join("");
  $("opts").querySelectorAll(".opt").forEach(b => b.onclick = () => { ans[cur] = +b.dataset.i; renderQ(); });
  $("prevBtn").disabled = cur === 0;
  renderPal();
}

function renderPal(){
  $("pal").innerHTML = Q.map((_,i) => {
    let c = "";
    if (marked[i]) c = ans[i] !== null ? "mka" : "mk";
    else if (ans[i] !== null) c = "ans";
    else if (visited[i]) c = "na";
    return `<button class="${c}${i===cur?" cur":""}" data-i="${i}" aria-label="${t("q")} ${i+1}">${i+1}</button>`;
  }).join("");
  $("pal").querySelectorAll("button").forEach(b => b.onclick = () => { cur = +b.dataset.i; renderQ(); });
  const a = ans.filter(x => x !== null).length, mk = marked.filter(Boolean).length;
  const nv = visited.filter(v => !v).length, na = visited.filter((v,i) => v && ans[i] === null).length;
  $("counts").innerHTML = [[t("cAns"),a],[t("cNa"),na],[t("cMk"),mk],[t("cNv"),nv]].map(([l,v]) => `<div><span>${l}</span><b>${v}</b></div>`).join("");
}

function go(d){ if (cur + d >= 0 && cur + d < N) { cur += d; renderQ(); window.scrollTo({top:0}); } }

function askSubmit(){
  const a = ans.filter(x => x !== null).length;
  $("mBody").textContent = UI[lang].mBody(a, N - a);
  $("modal").style.display = "grid"; $("mYes").focus();
}

function finish(auto){
  clearInterval(tick); done = true;
  $("modal").style.display = "none";
  $("quiz").style.display = "none"; $("timer").style.display = "none";
  $("result").style.display = "block";
  renderResult();
  if (auto) alert(t("timeUp"));
  window.scrollTo(0,0);
}

function renderResult(){
  let c = 0, w = 0;
  Q.forEach((q,i) => { if (ans[i] === null) return; ans[i] === q.a ? c++ : w++; });
  const s = N - c - w, score = Math.round((c - w/3) * 100) / 100;
  const acc = c + w ? Math.round(c / (c + w) * 100) : 0;
  $("scoreVal").textContent = score;
  const pct = Math.max(0, score) / N * 100;
  $("ring").style.background = `conic-gradient(var(--leaf) ${pct}%, var(--chip) 0)`;
  $("stats").innerHTML = [[t("sC"),c,"var(--leaf)"],[t("sW"),w,"var(--red)"],[t("sS"),s,"var(--amber)"],[t("sA"),acc+"%","var(--ink)"]]
    .map(([l,v,col]) => `<div class="stat"><strong style="color:${col}">${v}</strong><span>${l}</span></div>`).join("");
  const v = t("verdicts"); $("verdict").textContent = score < 10 ? v[0] : score < 16 ? v[1] : score < 21 ? v[2] : v[3];
  $("review").innerHTML = Q.map((q,i) => {
    const d = q[lang], u = ans[i], st = u === null ? "s" : u === q.a ? "c" : "w";
    const tag = st === "c" ? t("tC") : st === "w" ? t("tW") : t("tS");
    const opts = d.o.map((o,j) => `<li class="${j===q.a?"right":(j===u?"wrong":"")}">(${K[j]}) ${o}</li>`).join("");
    return `<div class="rv ${st}"><span class="tag">${t("q")} ${i+1} · ${tag}</span><p>${d.q}</p><ul>${opts}</ul><div class="exp"><b>${t("ans")}: (${K[q.a]})</b> – ${d.e}</div></div>`;
  }).join("");
}

$("bEn").onclick = () => setLang("en");
$("bHi").onclick = () => setLang("hi");
$("startBtn").onclick = startTest;
$("retryBtn").onclick = startTest;
$("prevBtn").onclick = () => go(-1);
$("nextBtn").onclick = () => { if (cur === N-1) renderQ(); else go(1); };
$("clearBtn").onclick = () => { ans[cur] = null; renderQ(); };
$("markBtn").onclick = () => { marked[cur] = !marked[cur]; if (cur < N-1) go(1); else renderQ(); };
$("submitBtn").onclick = askSubmit;
$("mNo").onclick = () => { $("modal").style.display = "none"; };
$("mYes").onclick = () => finish(false);
document.addEventListener("keydown", e => {
  if ($("modal").style.display === "grid" && e.key === "Escape") $("modal").style.display = "none";
  if ($("quiz").style.display !== "grid" || $("modal").style.display === "grid") return;
  if (["1","2","3","4"].includes(e.key)) { ans[cur] = +e.key - 1; renderQ(); }
  if (e.key === "ArrowRight") go(1);
  if (e.key === "ArrowLeft") go(-1);
});
reset(); setLang("en");
</script>
</body>
</html>
